
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Grade Calculator</h1>

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name">

        <label for="mco">MCO Grade (50%):</label>
        <input type="number" id="mco" placeholder="Enter MCO grade"
               min="0" max="100" step="any">

        <label for="exam">Exam Grade (30%):</label>
        <input type="number" id="exam" placeholder="Enter exam grade"
               min="0" max="100" step="any">

        <label for="attendanceQuiz">Attendance and Quiz Grade (20%):</label>
        <input type="number" id="attendanceQuiz"
               placeholder="Enter attendance and quiz grade"
               min="0" max="100" step="any">

        <div class="button-group">
            <button type="button" onclick="calculateGrade()">
                Calculate Grade
            </button>

            <button type="button" class="reset-button" onclick="resetCalculator()">
                Reset
            </button>
        </div>

        <div id="result" aria-live="polite"></div>

        <section class="history-section">
            <h2>Calculation History</h2>

            <input
                type="text"
                id="historySearch"
                placeholder="Search student name..."
                oninput="displayHistory()"
                aria-label="Search calculation history by student name"
            >

            <div class="history-actions">
                <button type="button" onclick="exportHistory()" class="export-button">
                    Export History to CSV
                </button>

                <button type="button" onclick="clearHistory()" class="clear-history-button">
                    Clear History
                </button>
            </div>

            <div id="historyList" aria-live="polite"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
